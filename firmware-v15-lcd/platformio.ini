; Firmware for the v15-LCD board (hardware/kicad_v15_lcd): the v14 board with the 2.13"
; e-paper replaced by a 1.9" 170x320 colour IPS LCD (ST7789V3, 4-wire SPI) and a PWM
; backlight. Everything else is the v14 hardware: ESP32-S3-MINI-1-N4R2 (4 MB flash, 2 MB
; quad PSRAM), OV5640 autofocus camera, TCA8418 keypad scanner, 150 mAh LiPo + MCP73831.
;
; This project is a COPY of ../firmware-prototype (the v14 firmware, which stays unchanged
; for the v14 boards). Pins come from ../hardware/kicad_v15_lcd/pins_v15_lcd.h.
; Build/upload: VS Code + PlatformIO, open this folder, click Upload (see README.md).

[env:v15lcd]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_qspi  ; 4 MB flash + 2 MB quad PSRAM (MINI-1-N4R2)
board_build.flash_mode = qio
board_upload.flash_size = 4MB
; Two app slots (1.9 MB each) for over-the-air updates with rollback (src/ota.h).
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DBOARD_V15_LCD=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial = the chip's own USB (the magnetic plug)
  ; ---- things to confirm on the real panel (see PORT_NOTES.md) ----
  -DLCD_ROTATION=1              ; 1 = landscape 320x170 (ribbon on the left); 3 = upside down
  -DLCD_INVERT=1                ; IPS ST7789V3 panels show inverted colours without this
  -DLCD_RGB_ORDER=0             ; 1 if red and blue are swapped
  -DPREVIEW_SWAP_BYTES=0        ; 1 if the live preview shows wrong colours (RGB565 byte order)
lib_ldf_mode = chain
lib_deps =
  lovyan03/LovyanGFX@^1.2.0
  https://github.com/0015/ESP32-OV5640-AF.git   ; autofocus firmware for the OV5640 (MIT)
  symlink://../core
