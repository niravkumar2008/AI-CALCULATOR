; Stage 3 firmware for the breadboard tester:
; generic ESP32-S3-CAM (ESP32-S3-WROOM N16R8, OV3660) + Waveshare 2.13" e-paper V4.
; Build/upload: VS Code + PlatformIO, open this folder, click Upload.

[env:tester]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi   ; 16 MB flash + 8 MB octal PSRAM (N16R8)
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_dtr = 0   ; opening the monitor must not reset the board or press BOOT
monitor_rts = 0
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0   ; Serial = the COM/UART USB-C port
lib_ldf_mode = chain
lib_deps =
  zinggjm/GxEPD2@^1.6.0
  symlink://../core
