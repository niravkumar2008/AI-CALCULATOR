# AI Calculator API: one Cloudflare Worker for the calculators (/v1/*) and the portal (/api/*).
# Everything here works on the FREE Workers plan. See README.md.
name = "ai-calc-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# Free-plan default address: https://ai-calc-api.<your-subdomain>.workers.dev
workers_dev = true

# D1 (SQLite). For local dev and tests the id below is a placeholder; before the first deploy
# run `npx wrangler d1 create ai-calc` and paste the printed database_id here.
[[d1_databases]]
binding = "DB"
database_name = "ai-calc"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Workers KV for the firmware image (free; no card needed, unlike R2). Before the first deploy run
# `npx wrangler kv namespace create FIRMWARE` and paste the printed id here.
[[kv_namespaces]]
binding = "FIRMWARE"
id = "00000000000000000000000000000000"

# The website (web/site) is served by this same Worker as static assets: one deploy, one
# address, first-party cookies. Static files are free and unlimited and never run the Worker;
# only these paths run it. Unknown pages get web/site/404.html.
[assets]
directory = "../site"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/v1/*", "/__dev/*", "/healthz"]

# Hourly clean-up: stale reservations (settled at worst case), unlinked calculators unused for
# 30 days, expired codes, sessions and counters.
[triggers]
crons = ["17 * * * *"]

# Settings (PLAN section 4b). Secrets (ANTHROPIC_API_KEY, RESEND_API_KEY, ADMIN_TOKEN) are NOT
# here: locally they go in .dev.vars, in production use `npx wrangler secret put NAME`.
# DEV_MODE is deliberately absent: it must never be set in production.
[vars]
ANTHROPIC_BASE_URL = "https://api.anthropic.com"
MODEL = "claude-sonnet-5-5"
MAX_TOKENS = "16000"
EFFORT = "high"
REFUSAL_FALLBACK = "0"   # off until fallback-model pricing is handled (security review S3)
UPSTREAM_TIMEOUT_MS = "60000"
PUBLIC_URL = "http://localhost:8787"
TRIAL_DAYS = "30"
MONTHLY_SOLVES = "300"
MONTHLY_SPEND_USD = "5"   # AI cost cap per account per month (plan is $10/month or $100/year)
GLOBAL_DAILY_CAP_USD = "50"
PRICE_IN_PER_MTOK = "2"
PRICE_OUT_PER_MTOK = "10"
MAIL_FROM = ""
MAX_NEW_TRIALS_PER_DAY = "20"
MAIL_DAILY_CAP = "80"
# Stage 3. Price ids come from the Stripe dashboard (sandbox first, then live). Secrets
# (STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET) go in with `npx wrangler secret put NAME`.
STRIPE_PRICE_SUB = ""          # AI tutor plan, $10/month
STRIPE_PRICE_SUB_YEARLY = ""   # AI tutor plan, $100/year (empty = yearly not offered)
STRIPE_PRICE_DEVICE = ""
STRIPE_TAX = "0"
STORE_OPEN = "0"          # "1" when preorders open; the site switches to "Preorder" by itself
WAITLIST_DAILY_CAP = "20000"   # abuse backstop only (a viral day must fit); Turnstile is the real bot check
STORE_GLOBAL_PER_HOUR = "300"
