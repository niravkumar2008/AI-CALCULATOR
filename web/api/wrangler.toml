# AI Calculator API: one Cloudflare Worker for the calculators (/v1/*) and the portal (/api/*).
# Everything here works on the FREE Workers plan. See README.md.
name = "ai-calc-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# Free-plan default address: https://ai-calc-api.<your-subdomain>.workers.dev
workers_dev = true

# D1 (SQLite). For local dev and tests the id below is a placeholder; before the first deploy
# run `npx wrangler d1 create ai-calc` and paste the printed database_id here.
[[d1_databases]]
binding = "DB"
database_name = "ai-calc"
database_id = "db024b4f-860c-47d6-9527-27767a77ff8c"
migrations_dir = "migrations"

# Workers KV for the firmware image (free; no card needed, unlike R2). Before the first deploy run
# `npx wrangler kv namespace create FIRMWARE` and paste the printed id here.
[[kv_namespaces]]
binding = "FIRMWARE"
id = "efce647ae5334e84978f1386714a0577"

# The website (web/site) is served by this same Worker as static assets: one deploy, one
# address, first-party cookies. Static files are free and unlimited and never run the Worker;
# only these paths run it. Unknown pages get web/site/404.html.
[assets]
directory = "../site"
binding = "ASSETS"
not_found_handling = "404-page"
# /q/* (QR link tokens, docs/LINK_QR_CONTRACT.md): the Worker sends /q/L1.<token> to /q/ so
# the token never stays in the address bar, then serves the static /q/ page.
run_worker_first = ["/api/*", "/v1/*", "/__dev/*", "/healthz", "/q/*"]

# Hourly clean-up: stale reservations (settled at worst case), unlinked calculators unused for
# 30 days, expired codes, sessions and counters.
[triggers]
crons = ["17 * * * *"]

# Settings (PLAN section 4b). Secrets (ANTHROPIC_API_KEY, RESEND_API_KEY, ADMIN_TOKEN) are NOT
# here: locally they go in .dev.vars, in production use `npx wrangler secret put NAME`.
# DEV_MODE is deliberately absent: it must never be set in production.
[vars]
ANTHROPIC_BASE_URL = "https://api.anthropic.com"
MODEL = "claude-sonnet-5-5"
MAX_TOKENS = "16000"
EFFORT = "medium"   # used when the calculator sends no effort (firmware does not send it yet)
EFFORT_NORMAL = "medium"   # the calculator's Normal / Careful / Max (SolveRequest effort)
EFFORT_CAREFUL = "high"
EFFORT_MAX = "xhigh"
REFUSAL_FALLBACK = "0"   # off until fallback-model pricing is handled (security review S3)
UPSTREAM_TIMEOUT_MS = "60000"
PUBLIC_URL = "http://localhost:8787"   # live address is set by `npm run deploy` (package.json)
TRIAL_DAYS = "30"
MONTHLY_SOLVES = "300"
MONTHLY_SPEND_USD = "5"   # AI cost cap per account per month (plan is $15/month or $120/year)
GLOBAL_DAILY_CAP_USD = "50"
PRICE_IN_PER_MTOK = "2"
PRICE_OUT_PER_MTOK = "10"
MAIL_FROM = "Proofline <onboarding@resend.dev>"   # testing: Resend only delivers to your own account e-mail. At launch: "Proofline <login@your-domain>"
MAX_NEW_TRIALS_PER_DAY = "20"
MAIL_DAILY_CAP = "80"
# Stage 3. Price ids come from the Stripe dashboard (sandbox first, then live). Secrets
# (STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET) go in with `npx wrangler secret put NAME`.
STRIPE_PRICE_SUB = ""          # AI tutor plan, $15/month
STRIPE_PRICE_SUB_YEARLY = ""   # AI tutor plan, $120/year (empty = yearly not offered)
STRIPE_PRICE_DEVICE = ""
STRIPE_TAX = "0"
# REQUIRED once STRIPE_SECRET_KEY is set (unless DEV_MODE=1): the same API version the webhook
# endpoint was created with, e.g. "2026-09-30.clover". Empty + a key = the Worker refuses to
# start Stripe work (503, config_error in the logs). GUIDE 4.7.
STRIPE_API_VERSION = ""
STRIPE_PORTAL_CONFIG = ""   # bpc_... dedicated Customer Portal configuration (empty = account default)
STRIPE_SHIPPING_RATE = ""   # shr_... shipping rate offered on the calculator checkout (empty = none)
STORE_OPEN = "0"          # "1" when preorders open; the site switches to "Preorder" by itself
WAITLIST_DAILY_CAP = "20000"   # abuse backstop only (a viral day must fit); Turnstile is the real bot check
STORE_GLOBAL_PER_HOUR = "300"
