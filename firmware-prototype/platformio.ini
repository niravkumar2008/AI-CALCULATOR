; Firmware for the final prototype: the custom board inside the Casio
; (hardware/kicad/ai_calc.kicad_sch). ESP32-S3-MINI-1-N4R2 (4 MB flash, 2 MB
; quad PSRAM), OV5640 autofocus camera, 2.13" e-paper panel, whole keypad
; through a TCA8418 keypad scanner, 150 mAh LiPo with MCP73831 charger.
; Build/upload: VS Code + PlatformIO, open this folder, click Upload.
; The tester has its own firmware in ../firmware.

[env:prototype]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_qspi  ; 4 MB flash + 2 MB quad PSRAM (MINI-1-N4R2)
board_build.flash_mode = qio
board_upload.flash_size = 4MB
; Two app slots (1.9 MB each) for over-the-air updates with rollback (src/ota.h); the
; build is ~1.3 MB. The switch from huge_app.csv needs one USB flash; NVS sits at the same
; place in both tables, so saved settings survive it.
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial = the chip's own USB (the magnetic plug)
lib_ldf_mode = chain
lib_deps =
  zinggjm/GxEPD2@^1.6.0
  https://github.com/0015/ESP32-OV5640-AF.git   ; autofocus firmware for the OV5640 (MIT)
  symlink://../core
