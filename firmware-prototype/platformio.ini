; Firmware for the final prototype: the custom board inside the Casio.
; ESP32-S3-WROOM-1-N16R8 (same module and memory as the tester), OV5640
; autofocus camera, Waveshare 2.13" e-paper panel, whole keypad through a
; TCA8418 keypad scanner, 150 mAh LiPo.
; Build/upload: VS Code + PlatformIO, open this folder, click Upload.
; The tester has its own firmware in ../firmware.

[env:prototype]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi   ; 16 MB flash + 8 MB octal PSRAM (N16R8)
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial = the chip's own USB (the magnetic plug)
lib_ldf_mode = chain
lib_deps =
  zinggjm/GxEPD2@^1.6.0
  https://github.com/0015/ESP32-OV5640-AF.git   ; autofocus firmware for the OV5640 (MIT)
  symlink://../core
