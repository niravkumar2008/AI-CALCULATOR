<text class="t" x="150.00" y="98.55">camera 5.4 (8.5 x 8.5 module, 7 mm window)</text>
<text class="t" x="165.60" y="79.31">LiPo #1317 150 mAh 3.8 thick (flat on the back-cover floor, 2.2 under the board)</text>
<text class="t" x="127.50" y="60.50">magnet body (Yiwei 21 x 7 face, beside the board edge)</text>
<text class="t" x="116.65" y="88.30">ANTENNA TAB 4.5 x 15.4: cut out WITH the board</text>
<text class="t" x="168.30" y="78.20">zone 4 (KEEP): LR44 cup (front shell) - KEEP, do not grind</text>
<text class="t" x="127.50" y="55.90">zone 5: magnet slot (top wall): CUT 21.5 wide</text>
<text class="t" x="116.55" y="89.00" transform="rotate(-90 116.55,89.00)">zone 6: notch the inner rib to 7 mm below the rim, 14-49 mm from the top edge (verification 12)</text><text class="t" x="113.0" y="97.0" transform="rotate(-90 113.0,97.0)" style="fill:#d00">zone 6b: snip 3 pins + 3 hooks flush, THIS wall</text><text class="t" x="187.0" y="97.0" transform="rotate(-90 187.0,97.0)" style="fill:#d00">zone 6b: snip 3 pins + 3 hooks flush, THIS wall too</text><text class="t" x="116.5" y="121.5" style="fill:#d00">6c?</text><text class="t" x="183.5" y="121.5" style="fill:#d00">6c?</text><text class="s" x="112.162" y="30.936999999999998" style="text-anchor:start">GRIND MAP - lay in the FRONT shell (keys down), printed side up</text><text class="s" x="112.162" y="34.937" style="text-anchor:start">part height above board: red 4+ mm, orange 2-4, blue 1-2; red = front-shell feature to cut, green = keep, yellow = ESP32 antenna tab (cut out with the board)</text><text class="s" x="112.162" y="38.937" style="text-anchor:start;fill:#d00;font-size:1.5px">zone 5 magnet slot (top wall) (front shell): cut through the top end wall, 21.5 wide, from the rim (parting line) down to 7.95 mm below it (U-notch); the magnet face (21 x 7) sits 0.45-7.45 mm below the rim, flush with the outside</text><text class="s" x="112.162" y="41.937" style="text-anchor:start;fill:#d00;font-size:1.5px">zone 6 antenna relief (inner rib) (front shell): NEEDED (depth rod 2026-10-06: rib top 4.5-5 mm below the rim, board at 5.5-6.3): file the inner rib down to 7.0 mm below the rim for 35 mm (14 to 49 mm from the rim's top outer edge right above the side rib, about 1 mm lower than the middle of the top end), solar-window side. zone 6b (both walls, red blocks on the ribs): snip the 3 round pins and the 3 U-hooks flush with the rib (pins 5.1-6.1, hooks 5.5 below the rim = board height; J2 side 0-0.5 mm from the board edge, solar side 0.7-1.4 mm inside the board / antenna tab). zone 6c (only if the paper's wide corners ride up after 6b): file the lower 2-3 mm of the rib end on that side. See hardware/verification/12_rib_pin_recheck.md</text><text class="s" x="112.162" y="44.937" style="text-anchor:start;fill:#1a7f37;font-size:2.2px">zone 4 (KEEP) LR44 cup (front shell): KEEP: do not grind (the battery lies on the back-cover floor, 0.3 mm under the cup)</text><text class="s" x="112.162" y="47.937" style="text-anchor:start;fill:#000;font-size:1.5px">ANTENNA TAB (yellow): ESP32-S3-MINI-1 antenna tab: bare module PCB 0.8 mm thick, 4.15 mm past the board edge (body x 114.75-135.25, y 89.3-104.7). Paper dry fit: cut the tab out WITH the board.</text><text class="s" x="112.162" y="50.937" style="text-anchor:start;fill:#d00;font-size:2.2px">never grind into the floor: keep at least 0.8 mm of plastic</text><text class="s" x="112.162" y="53.937" style="text-anchor:start;fill:#000;font-size:1.5px">zone numbers = the Shell Grinding Guide (grinding_manual.html): 1 solar box, 2 rib B, 3 camera window, 4 LR44 cup (keep), 5 magnet notch (+5b lip), 6 antenna relief, 6b pins + hooks (both walls), 6c rib ends (only if needed)</text><g><line x1="112.162" y1="222.793" x2="162.162" y2="222.793" stroke="#000" stroke-width="0.4"/><text class="s" x="112.162" y="226.793" style="text-anchor:start">50 mm: check this with a ruler (print at 100 %)</text></g></svg>