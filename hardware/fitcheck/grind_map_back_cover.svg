<text class="t" x="174.07" y="147.10">U6 1.0</text>
<text class="t" x="150.07" y="98.55">camera 5.4 (8.5 x 8.5 module, 7 mm window)</text>
<text class="t" x="134.47" y="79.31">LiPo #1317 150 mAh 3.8 thick (flat on the back-cover floor, 2.2 under the board)</text>
<text class="t" x="172.57" y="60.50">magnet body (Yiwei 21 x 7 face, beside the board edge)</text>
<text class="t" x="183.42" y="88.30">ANTENNA TAB 4.5 x 15.4: cut out WITH the board</text>
<text class="t" x="149.87" y="135.30">small ring 4 mm</text>
<text class="t" x="149.57" y="157.30">big ring 4 mm</text>
<text class="t" x="150.07" y="93.86">upper rib B (camera): grind 1 mm down to the floor over 14 mm</text>
<text class="t" x="162.57" y="65.80">zone 1: solar box 5.5 mm - GRIND FLAT</text>
<text class="t" x="150.07" y="101.60">zone 3: drill 7 mm here</text><text class="s" x="112.162" y="30.936999999999998" style="text-anchor:start">GRIND MAP - lay in the BACK cover (inside up): mirrored</text><text class="s" x="112.162" y="34.937" style="text-anchor:start">part height above board: red 4+ mm, orange 2-4, blue 1-2; dashed = back-cover ribs/rings (red = GRIND where it crosses a part); yellow = ESP32 antenna tab</text><text class="s" x="112.162" y="38.937" style="text-anchor:start;fill:#d00;font-size:2.2px">zone 1 solar box: remove 5.5 mm (down to the floor)</text><text class="s" x="112.162" y="41.937" style="text-anchor:start;fill:#d00;font-size:2.2px">zone 2 upper rib B (camera): remove 1 mm (down to the floor)</text><text class="s" x="112.162" y="44.937" style="text-anchor:start;fill:#d00;font-size:2.2px">zone 3: drill 7 mm through the floor (after zone 2); 9/32 in = 7.1 is fine</text><text class="s" x="112.162" y="47.937" style="text-anchor:start;fill:#d00;font-size:2.2px">never grind into the floor: keep at least 0.8 mm of plastic</text><text class="s" x="112.162" y="50.937" style="text-anchor:start;fill:#000;font-size:1.5px">zone numbers = the Shell Grinding Guide (grinding_manual.html): 1 solar box, 2 rib B, 3 camera window, 4 LR44 cup (keep), 5 magnet notch (+5b lip), 6 antenna relief (only if needed)</text><g><line x1="112.162" y1="222.793" x2="162.162" y2="222.793" stroke="#000" stroke-width="0.4"/><text class="s" x="112.162" y="226.793" style="text-anchor:start">50 mm: check this with a ruler (print at 100 %)</text></g></svg>